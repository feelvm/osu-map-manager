[package]
name = "osu-map-manager-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "osu-map-manager-setup"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
common = { package = "osu-map-manager-installer-common", path = "../common" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[build-dependencies]
anyhow.workspace = true
embed-resource = "3"
flate2.workspace = true
