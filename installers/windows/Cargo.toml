[workspace]
resolver = "3"
members = ["common", "setup", "uninstaller"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1.0"
flate2 = "1.1"
windows-sys = "0.61"
winreg = "0.56"

# The setup ships once per release; favor a small binary over build time.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
