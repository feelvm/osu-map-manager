name: Release

on:
  push:
    tags:
      - "v*"
  # Releases are published from the web UI, which creates the tag on
  # publish; this guarantees a stamped build is attached to the published
  # release even when the tag-push event does not fire.
  release:
    types: [published]

# Publishing a release can fire both triggers at once; keep a single build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The exe must report exactly the release tag, so the version is
      # stamped from the tag instead of trusting a manually bumped
      # Cargo.toml (`cargo update` then syncs the lockfile for --locked).
      - name: Stamp the app version from the release tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-+].+)?$') {
            throw "release tag '$tag' must be vX.Y.Z so the exe reports exactly the tag"
          }
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]*"', "version = `"$version`"" | Set-Content Cargo.toml -NoNewline
          cargo update -p osu-map-manager
      - run: cargo build --release --locked
      - name: Package exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/osu-map-manager.exe dist/osu-map-manager.exe
          Compress-Archive -Path dist/osu-map-manager.exe -DestinationPath osu-map-manager-windows-x86_64.zip -Force
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: osu-map-manager-windows-x86_64.zip
          generate_release_notes: true
