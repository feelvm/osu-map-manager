[package]
name = "osu-map-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.27"
egui = "0.27"
md5 = "0.7"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "stream"] }
rfd = "0.14"
rosu-pp = "4.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
zip = "2.4"
